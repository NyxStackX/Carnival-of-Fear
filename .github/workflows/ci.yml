# Vérifie chaque push et chaque pull request : compilation, tests, seuil de couverture.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler, tester, vérifier la couverture
        run: mvn -B verify

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco
